<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声邻 · 网页协同</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon128.png" width="28" height="28" alt="">
    <h1>声邻</h1>
    <button id="retry" class="connection" type="button" data-tone="pending" aria-label="正在连接 Mac" title="正在连接 Mac" disabled><span aria-hidden="true"></span></button>
  </header>
  <main>
    <div class="roles" role="group" aria-label="当前网页的参与方式">
      <button data-command="release" type="button" aria-pressed="true" title="让此网页退出协同" disabled>不参与</button>
      <button data-command="conversation" type="button" aria-pressed="false" title="保留通话原声；先选择，再开启 ChatGPT Voice" disabled>通话</button>
      <button data-command="background" type="button" aria-pressed="false" title="允许声邻按 Mac 策略调低此页音量；音频只在浏览器内处理" disabled>背景</button>
    </div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
