[package]
name = "shenglin-windows"
version = "0.2.0-beta.7"
edition = "2021"

[[bin]]
name = "shenglin"
path = "src/main.rs"

[dependencies]
shenglin_core = { path = "../Core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
mdns-sd = "=0.21.6"
ctrlc = { version = "3", features = ["termination"] }
anyhow = "1"
fs2 = "0.4"
socket2 = "0.6"
wasapi = "=0.26.0"
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
