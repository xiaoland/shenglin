[package]
name = "shenglin_core"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["lib", "staticlib", "cdylib"]
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
[features]
bindgen = ["uniffi/cli"]
[dependencies]
uniffi = "=0.31.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
subtle = "2"
thiserror = "2"
getrandom = "0.2"
unicode-segmentation = "1"
unicode-general-category = "1"
[build-dependencies]
cc = "1"
