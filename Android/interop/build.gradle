plugins { id 'org.jetbrains.kotlin.jvm' }
kotlin { jvmToolchain(17) }
sourceSets {
    main {
        kotlin.srcDirs '../app/src/main/java/local/shenglin/core', '../../local/rust-bindings/kotlin'
        java.srcDirs '../app/src/test/java/local/shenglin/core'
    }
}
dependencies {
    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation 'org.json:json:20250517'
}
tasks.named('compileKotlin').configure { dependsOn ':app:buildRustCore' }
