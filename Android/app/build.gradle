plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def releasePropertiesFile = providers.environmentVariable('SHENGLIN_ANDROID_SIGNING_PROPERTIES')
    .map { file(it) }.getOrElse(new File(rootProject.projectDir.parentFile, 'local/android-release/signing.properties'))
def releaseProperties = new Properties()
if (releasePropertiesFile.isFile()) releasePropertiesFile.withInputStream { releaseProperties.load(it) }
def releaseSigningReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseProperties[it] }

android {
    namespace 'local.shenglin'
    compileSdk 36
    ndkVersion '30.0.14904198'
    defaultConfig {
        applicationId 'local.shenglin'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0-beta.3'
        testInstrumentationRunner 'local.shenglin.RuntimeChecks'
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseProperties['storeFile'])
                storePassword releaseProperties['storePassword']
                keyAlias releaseProperties['keyAlias']
                keyPassword releaseProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug { ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' } }
        release {
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            debuggable false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true; compose true }
    sourceSets.main.java.srcDir '../../local/rust-bindings/kotlin'
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('rustJni')
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    testImplementation 'org.json:json:20250517'
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.java.dev.jna:jna:5.17.0'
}

def rustRoot = rootProject.projectDir.parentFile
def buildRust = tasks.register('buildRustCore', Exec) {
    workingDir rustRoot
    commandLine 'bash', new File(rustRoot, 'scripts/build-rust-core.sh'), 'android'
    inputs.dir new File(rustRoot, 'Core/src')
    inputs.files new File(rustRoot, 'Core/Cargo.toml'), new File(rustRoot, 'Core/Cargo.lock'), new File(rustRoot, 'Core/build.rs'), new File(rustRoot, 'Core/uniffi.toml'), new File(rustRoot, 'scripts/build-rust-core.sh'), new File(rustRoot, 'scripts/build-pake.sh')
    inputs.dir new File(rustRoot, 'NativePAKE')
    outputs.file new File(rustRoot, 'local/rust-bindings/kotlin/uniffi/shenglin_core/shenglin_core.kt')
    outputs.files(['aarch64-linux-android', 'x86_64-linux-android', 'armv7-linux-androideabi', 'i686-linux-android'].collect { new File(rustRoot, "local/rust-target/$it/release/libshenglin_core.so") })
}
def stageRust = tasks.register('stageRustLibraries', Copy) {
    dependsOn buildRust
    into layout.buildDirectory.dir('rustJni')
    from(new File(rustRoot, 'local/rust-target/aarch64-linux-android/release/libshenglin_core.so')) { into 'arm64-v8a' }
    from(new File(rustRoot, 'local/rust-target/x86_64-linux-android/release/libshenglin_core.so')) { into 'x86_64' }
    from(new File(rustRoot, 'local/rust-target/armv7-linux-androideabi/release/libshenglin_core.so')) { into 'armeabi-v7a' }
    from(new File(rustRoot, 'local/rust-target/i686-linux-android/release/libshenglin_core.so')) { into 'x86' }
}
tasks.named('preBuild').configure { dependsOn stageRust }

tasks.register('prepareHostInterop') {
    dependsOn ':interop:classes'
    doLast {
        def output = new File(rustRoot, 'local/AndroidInterop/kotlin-classpath.txt')
        output.parentFile.mkdirs()
        output.text = project(':interop').sourceSets.main.runtimeClasspath.asPath
        println "Host interop classpath: ${output}"
    }
}
tasks.withType(Test).configureEach {
    systemProperty 'jna.library.path', new File(rustRoot, 'local/rust-target/aarch64-apple-darwin/release').path
}

// Never silently produce an unsigned release when local signing credentials are absent.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!releaseSigningReady) throw new GradleException("Release signing requires storeFile/storePassword/keyAlias/keyPassword in ${releasePropertiesFile}")
    }
}
